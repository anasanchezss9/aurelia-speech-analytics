<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="640" viewBox="0 0 1240 640" font-family="'DM Sans', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A6F77"/>
    </marker>
    <marker id="seta-clara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B9C4C8"/>
    </marker>
    <marker id="seta-lava" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#FF3621"/>
    </marker>
    <style>
      .rotulo { font-size: 11px; font-weight: 700; letter-spacing: 1.4px; fill: #FF3621; }
      .titulo { font-size: 13.5px; font-weight: 700; fill: #1B3139; }
      .texto { font-size: 11.5px; fill: #5A6F77; }
      .titulo-claro { font-size: 13.5px; font-weight: 700; fill: #FFFFFF; }
      .texto-claro { font-size: 11.5px; fill: #DCE4E7; }
      .camada { font-size: 10.5px; font-weight: 700; letter-spacing: 1.2px; fill: #FF8A73; }
      .caixa { fill: #FFFFFF; stroke: #DEDBD3; stroke-width: 1; }
      .linha { stroke: #5A6F77; stroke-width: 1.4; fill: none; }
    </style>
  </defs>

  <rect width="1240" height="640" rx="18" fill="#F9F7F4"/>

  <text x="40" y="50" font-size="22" font-weight="700" fill="#1B3139">Da liga&#231;&#227;o da consultora &#224; decis&#227;o do analista</text>
  <text x="40" y="74" class="texto" font-size="13">Uma jornada s&#243;, num cat&#225;logo do Unity Catalog &#8212; e a decis&#227;o volta para o modelo como r&#243;tulo</text>

  <!-- Fontes -->
  <text x="40" y="112" class="rotulo">FONTES</text>
  <rect x="40" y="128" width="180" height="64" rx="10" class="caixa"/>
  <text x="54" y="155" class="titulo">Central telef&#244;nica</text>
  <text x="54" y="174" class="texto">&#225;udio WAV de 8 kHz</text>
  <rect x="40" y="204" width="180" height="64" rx="10" class="caixa"/>
  <text x="54" y="231" class="titulo">Telefonia</text>
  <text x="54" y="250" class="texto">transcri&#231;&#245;es em texto</text>
  <rect x="40" y="280" width="180" height="64" rx="10" class="caixa"/>
  <text x="54" y="307" class="titulo">Pedidos e entregas</text>
  <text x="54" y="326" class="texto">itens, peso no CD e no hub</text>
  <rect x="40" y="356" width="180" height="64" rx="10" class="caixa"/>
  <text x="54" y="383" class="titulo">Atendimento e cadastro</text>
  <text x="54" y="402" class="texto">chamados, investiga&#231;&#245;es</text>

  <line x1="220" y1="160" x2="264" y2="208" class="linha" marker-end="url(#seta)"/>
  <line x1="220" y1="236" x2="264" y2="250" class="linha" marker-end="url(#seta)"/>
  <line x1="220" y1="312" x2="264" y2="306" class="linha" marker-end="url(#seta)"/>
  <line x1="220" y1="388" x2="264" y2="356" class="linha" marker-end="url(#seta)"/>

  <!-- Lakeflow -->
  <text x="250" y="112" class="rotulo">LAKEFLOW</text>
  <rect x="250" y="120" width="540" height="310" rx="14" fill="#1B3139"/>
  <text x="268" y="148" class="titulo-claro" font-size="14.5">Spark Declarative Pipelines</text>
  <text x="268" y="166" class="texto-claro" fill="#B9C4C8">serverless &#183; um pipeline em SQL, do arquivo &#224; feature do modelo</text>

  <rect x="266" y="182" width="160" height="232" rx="10" fill="#24414A"/>
  <text x="280" y="206" class="camada">BRONZE</text>
  <text x="280" y="226" class="titulo-claro">como chega</text>
  <text x="280" y="252" class="texto-claro">&#8226; read_files em streaming</text>
  <text x="280" y="272" class="texto-claro">&#8226; &#225;udio, texto e 10</text>
  <text x="290" y="288" class="texto-claro">tabelas operacionais</text>
  <text x="280" y="308" class="texto-claro">&#8226; cada arquivo lido</text>
  <text x="290" y="324" class="texto-claro">uma vez</text>

  <rect x="438" y="182" width="160" height="232" rx="10" fill="#24414A"/>
  <text x="452" y="206" class="camada">SILVER</text>
  <text x="452" y="226" class="titulo-claro">conferido</text>
  <text x="452" y="252" class="texto-claro">&#8226; ai_transcribe: &#225;udio</text>
  <text x="462" y="268" class="texto-claro">de telefonia em texto</text>
  <text x="452" y="288" class="texto-claro">&#8226; &#225;udio e texto unidos</text>
  <text x="452" y="308" class="texto-claro">&#8226; pedidos, entregas e</text>
  <text x="462" y="324" class="texto-claro">chamados limpos</text>
  <text x="452" y="344" class="texto-claro">&#8226; 8 expectativas de</text>
  <text x="462" y="360" class="texto-claro">qualidade</text>

  <rect x="610" y="182" width="164" height="232" rx="10" fill="#24414A"/>
  <text x="624" y="206" class="camada">GOLD</text>
  <text x="624" y="226" class="titulo-claro">para usar</text>
  <text x="624" y="252" class="texto-claro">&#8226; ai_query + JSON</text>
  <text x="634" y="268" class="texto-claro">Schema: tipo, produtos,</text>
  <text x="634" y="284" class="texto-claro">sinais no relato</text>
  <text x="624" y="304" class="texto-claro">&#8226; features por chamado:</text>
  <text x="634" y="320" class="texto-claro">peso, hist&#243;rico, rota</text>
  <text x="624" y="340" class="texto-claro">&#8226; pedido conferido</text>
  <text x="634" y="356" class="texto-claro">no cadastro</text>
  <text x="624" y="376" class="texto-claro">&#8226; agregados por ciclo</text>

  <line x1="427" y1="298" x2="436" y2="298" stroke="#B9C4C8" stroke-width="1.4" marker-end="url(#seta-clara)"/>
  <line x1="599" y1="298" x2="608" y2="298" stroke="#B9C4C8" stroke-width="1.4" marker-end="url(#seta-clara)"/>

  <!-- Modelo -->
  <text x="822" y="112" class="rotulo">MODELO</text>
  <rect x="822" y="120" width="182" height="310" rx="12" class="caixa" stroke="#FF3621" stroke-width="1.6"/>
  <text x="838" y="148" class="titulo" font-size="14.5">Modelo de fraude</text>
  <text x="838" y="176" class="texto">&#8226; MLflow: 3 candidatos</text>
  <text x="848" y="192" class="texto">no mesmo teste temporal</text>
  <text x="838" y="212" class="texto">&#8226; gradient boosting +</text>
  <text x="848" y="228" class="texto">calibra&#231;&#227;o isot&#244;nica</text>
  <text x="838" y="248" class="texto">&#8226; registrado no UC</text>
  <text x="848" y="264" class="texto">com alias @campeao</text>
  <text x="838" y="284" class="texto">&#8226; Model Serving,</text>
  <text x="848" y="300" class="texto">scale-to-zero</text>
  <text x="838" y="320" class="texto">&#8226; job di&#225;rio: pipeline</text>
  <text x="848" y="336" class="texto">&#8594; score &#8594; fila</text>
  <rect x="836" y="362" width="154" height="52" rx="8" fill="#FDEDEA"/>
  <text x="848" y="384" font-size="12" font-weight="700" fill="#C42A17">PR-AUC 0,83</text>
  <text x="848" y="402" font-size="11" fill="#C42A17">contra 0,18 do LLM sozinho</text>

  <line x1="775" y1="270" x2="820" y2="270" class="linha" marker-end="url(#seta)"/>

  <!-- Uso -->
  <text x="1036" y="112" class="rotulo">USO</text>
  <rect x="1036" y="120" width="168" height="92" rx="10" class="caixa"/>
  <text x="1050" y="146" class="titulo">Databricks App</text>
  <text x="1050" y="166" class="texto">fila do analista: score,</text>
  <text x="1050" y="182" class="texto">evid&#234;ncia e decis&#227;o</text>
  <rect x="1036" y="226" width="168" height="92" rx="10" class="caixa"/>
  <text x="1050" y="252" class="titulo">Lakebase Postgres</text>
  <text x="1050" y="272" class="texto">fila em synced table</text>
  <text x="1050" y="288" class="texto">(~160 ms); decis&#245;es</text>
  <text x="1050" y="304" class="texto">s&#243; com inser&#231;&#227;o</text>
  <rect x="1036" y="332" width="168" height="98" rx="10" class="caixa"/>
  <text x="1050" y="358" class="titulo">Genie</text>
  <text x="1050" y="378" class="texto">preven&#231;&#227;o de perdas</text>
  <text x="1050" y="394" class="texto">pergunta em portugu&#234;s</text>
  <text x="1050" y="410" class="texto">sobre as tabelas gold</text>

  <line x1="1005" y1="272" x2="1034" y2="272" class="linha" marker-end="url(#seta)"/>
  <line x1="1120" y1="214" x2="1120" y2="224" class="linha" marker-start="url(#seta)" marker-end="url(#seta)"/>
  <path d="M 692 415 L 692 441 L 1018 441 L 1018 381 L 1034 381" class="linha" marker-end="url(#seta)"/>

  <!-- Unity Catalog -->
  <rect x="250" y="456" width="954" height="46" rx="10" fill="#EEEDE9"/>
  <text x="268" y="484" class="titulo">Unity Catalog</text>
  <text x="372" y="484" class="texto" font-size="12.5">um schema &#183; linhagem do arquivo de &#225;udio &#224; feature &#183; modelo com vers&#227;o e alias &#183; permiss&#245;es do app</text>

  <!-- Volta da decis&#227;o -->
  <path d="M 1204 290 L 1222 290 L 1222 548 L 727 548 L 727 504" stroke="#FF3621" stroke-width="1.6" stroke-dasharray="6 4" fill="none" marker-end="url(#seta-lava)"/>
  <text x="742" y="538" font-size="12" font-weight="700" fill="#C42A17">A decis&#227;o volta</text>
  <text x="848" y="538" font-size="12" fill="#5A6F77">CDF do Lakebase &#8594; Delta no UC &#8594; r&#243;tulo do pr&#243;ximo treino</text>

  <text x="40" y="604" class="texto" font-size="11.5">Dados sint&#233;ticos: a Aur&#233;lia, as consultoras, os pedidos e as liga&#231;&#245;es s&#227;o fict&#237;cios. Asset Bundles publicam o app, o pipeline, o job e as permiss&#245;es.</text>
</svg>
