# Arquitetura do Speech Analytics, a mesma da aba "Arquitetura" do app
# (src/backend/static/index.html). Formato em docs/metadados.md, seção
# "Arquitetura". Se o diagrama do app mudar, mude aqui também.

titulo: Arquitetura da solução
subtitulo: >-
  Tudo roda na Databricks Intelligence Platform — sem mover dados entre
  vendors, com governança end-to-end via Unity Catalog.

principal:
  titulo: O que está rodando nesta demo
  descricao: >-
    Padrão real-time: WebSocket cumulativo entre o navegador e um
    Databricks App, com Whisper em GPU e Claude para análise.

  nos:
    - id: navegador
      icone: "🌐"
      nome: Navegador
      detalhe: MediaRecorder · WebM/Opus
      cor: azul
      papel: >-
        Grava o microfone com o MediaRecorder e manda o áudio em WebM/Opus para
        o app por WebSocket; a transcrição volta pelo mesmo canal enquanto a
        pessoa fala.

    - id: app
      icone: "⚡"
      nome: Databricks App
      detalhe: FastAPI · PyAV · OAuth
      cor: laranja
      papel: Hosting do FastAPI + frontend, OAuth automático, escala gerenciada
      recursos:
        - tipo: app
          nome: aurelia-speech-analytics
        - tipo: warehouse
          id: 9fc569e6e984dcde
          rotulo: Serverless Starter Warehouse, que responde as consultas do painel

    - id: serving
      icone: "🎙️"
      nome: Mosaic AI Model Serving
      detalhe: Whisper Large V3 Turbo · GPU_MEDIUM
      cor: vermelho
      pills: [scale-to-zero, A10G]
      papel: Endpoint GPU para Whisper Turbo com scale-to-zero
      recursos:
        - tipo: endpoint
          nome: aurelia-whisper-turbo

    - id: fmapi
      icone: "🧠"
      nome: Foundation Model API
      detalhe: databricks-claude-sonnet-4-6
      cor: roxo
      pills: [JSON Schema, pay-per-token]
      papel: Claude Sonnet 4.6 pay-per-token, sem gerenciar infra
      recursos:
        - tipo: endpoint
          nome: databricks-claude-sonnet-4-6

    - id: uc
      icone: "🏛️"
      nome: Unity Catalog
      detalhe: >-
        Governança · Lineage · OAuth do app · Modelo registrado em
        `field_toolbox_catalog.aurelia_speech.whisper_large_v3_turbo`
      cor: verde
      papel: Registry do modelo Whisper, controle de acesso ao endpoint
      recursos:
        - tipo: modelo
          nome: field_toolbox_catalog.aurelia_speech.whisper_large_v3_turbo
        - tipo: schema
          nome: field_toolbox_catalog.aurelia_speech
          rotulo: Schema com o Volume dos áudios e as tabelas bronze, silver e gold

  camadas:
    - nos: [navegador, app]
      ligacao: {simbolo: "→", rotulo: WebSocket binário}
      seta_abaixo: REST + JSON Schema
    - nos: [serving, fmapi]
      ligacao: {simbolo: "+"}
      seta_abaixo: true
    - nos: [uc]

  componentes_titulo: Componentes Databricks usados
  componentes:
    - nome: Databricks Apps
      descricao: Hosting do FastAPI + frontend, OAuth automático, escala gerenciada
      peca: app
      recursos:
        - tipo: app
          nome: aurelia-speech-analytics
    - nome: Mosaic AI Model Serving
      descricao: Endpoint GPU para Whisper Turbo com scale-to-zero
      peca: serving
      recursos:
        - tipo: endpoint
          nome: aurelia-whisper-turbo
    - nome: Foundation Model API
      descricao: Claude Sonnet 4.6 pay-per-token, sem gerenciar infra
      peca: fmapi
      recursos:
        - tipo: endpoint
          nome: databricks-claude-sonnet-4-6
    - nome: Unity Catalog
      descricao: Registry do modelo Whisper, controle de acesso ao endpoint
      peca: uc
      recursos:
        - tipo: modelo
          nome: field_toolbox_catalog.aurelia_speech.whisper_large_v3_turbo
    - nome: MLflow
      descricao: Empacotamento do Whisper como pyfunc + tracking
      recursos:
        - tipo: experimento
          id: "4268041011952223"
          rotulo: Experimento do notebook que registra o Whisper
    - nome: Asset Bundles (DAB)
      descricao: Deploy declarativo do app + permissões de endpoint

alternativas:
  titulo: Outras arquiteturas para Speech Analytics
  subtitulo: O mesmo workspace cobre os 3 padrões — escolha o certo para cada caso de uso.
  vistas:
    - titulo: Processamento em massa
      icone: "📦"
      tag: BATCH · D+1 / horário
      cor: azul
      descricao: >-
        Pipeline diário que processa todas as chamadas do dia anterior. Ideal
        para análises retroativas, backfill histórico e relatórios gerenciais.
      fluxo:
        - icone: "📁"
          nome: UC Volumes
          recursos:
            - tipo: volume
              nome: field_toolbox_catalog.aurelia_speech.audio_landing
        - icone: "🔄"
          nome: Auto Loader
          recursos:
            - tipo: tabela
              nome: field_toolbox_catalog.aurelia_speech.bronze_audio_files
              rotulo: Tabela bronze que o Auto Loader alimenta
        - icone: "⚡"
          nome: pandas_udf + Whisper
          recursos:
            - tipo: endpoint
              nome: aurelia-whisper-turbo
        - icone: "🗃️"
          nome: Delta Silver
          recursos:
            - tipo: tabela
              nome: field_toolbox_catalog.aurelia_speech.silver_transcripts
        - icone: "🤖"
          nome: ai_query SQL
          recursos:
            - tipo: endpoint
              nome: databricks-claude-sonnet-4-6
        - icone: "📊"
          nome: Delta Gold
          recursos:
            - tipo: tabela
              nome: field_toolbox_catalog.aurelia_speech.gold_call_insights
      componentes:
        - nome: Jobs / Workflows
          descricao: Orquestração diária serverless
        - nome: Auto Loader
          descricao: Ingestão incremental de WAV/MP3 do storage
        - nome: Spark + pandas_udf
          descricao: Whisper paralelizado em todos os workers
        - nome: Delta Lake (Bronze/Silver/Gold)
          descricao: Arquitetura medallion governada
          recursos:
            - tipo: schema
              nome: field_toolbox_catalog.aurelia_speech
        - nome: AI Functions (ai_query, ai_classify, ai_mask)
          descricao: Análise LLM em SQL puro, sem Python
        - nome: AI/BI Dashboards + Genie
          descricao: Consumo final por gestores
      quando_usar: >-
        análise diária consolidada, refazer análises com novos prompts,
        backfill de meses de histórico, treinamento de modelos.

    - titulo: Processamento em massa sem GPU
      icone: "🧩"
      tag: BATCH · ai_transcribe (Beta)
      cor: cinza
      descricao: >-
        O mesmo batch, com a transcrição feita pela AI Function ai_transcribe
        dentro do SQL. Sem endpoint para subir nem esquecer ligado, sem resample
        nem chunking, e com diarização por segmento. Comparada com o Whisper
        nas mesmas 13 ligações em docs/comparacao-whisper-vs-ai-transcribe.md.
      fluxo:
        - icone: "📁"
          nome: UC Volumes
          recursos:
            - tipo: volume
              nome: field_toolbox_catalog.aurelia_speech.audio_landing
        - icone: "🔄"
          nome: Auto Loader
          recursos:
            - tipo: tabela
              nome: field_toolbox_catalog.aurelia_speech.bronze_audio_files
              rotulo: A mesma bronze da versão com Whisper
        - {icone: "🧩", nome: ai_transcribe SQL}
        - icone: "🗃️"
          nome: Delta Silver
          recursos:
            - tipo: tabela
              nome: field_toolbox_catalog.aurelia_speech.silver_transcripts_ait
        - icone: "🤖"
          nome: ai_query SQL
          recursos:
            - tipo: endpoint
              nome: databricks-claude-sonnet-4-6
        - icone: "📊"
          nome: Delta Gold
          recursos:
            - tipo: tabela
              nome: field_toolbox_catalog.aurelia_speech.gold_call_insights_ait
      componentes:
        - nome: AI Functions (ai_transcribe, ai_query)
          descricao: Transcrição e análise em SQL, cobradas por uso
        - nome: Delta Lake (Bronze/Silver/Gold)
          descricao: Silver e gold próprias, lado a lado com as do Whisper
          recursos:
            - tipo: schema
              nome: field_toolbox_catalog.aurelia_speech
        - nome: Jobs / Workflows
          descricao: Orquestração serverless, environment 3+
      quando_usar: >-
        batch em que ninguém quer operar endpoint de GPU, ligações longas que
        estourariam o payload do Whisper, quando separar atendente de cliente
        importa. Valide no áudio do cliente antes: em PT-BR a função ainda não
        tem suporte oficial.

    - titulo: Near real-time
      icone: "🌊"
      tag: STREAMING · segundos a minutos
      cor: verde
      descricao: >-
        Plataforma de telefonia envia chunks contínuos para Kafka. Lakeflow
        consome, transcreve, classifica, e dispara ações sem operação manual.
      fluxo:
        - {icone: "📞", nome: Telefonia}
        - {icone: "🔥", nome: Kafka / Event Hub}
        - {icone: "⚡", nome: Structured Streaming}
        - icone: "🎙️"
          nome: Whisper Serving
          recursos:
            - tipo: endpoint
              nome: aurelia-whisper-turbo
        - {icone: "🤖", nome: ai_query streaming}
        - {icone: "🔔", nome: Webhook / Slack}
      componentes:
        - nome: Lakeflow / Spark Declarative Pipelines
          descricao: Pipeline streaming declarativo, exactly-once
        - nome: Structured Streaming
          descricao: Mesmo SDK do batch, com checkpoints
        - nome: Kafka / Event Hubs / Kinesis
          descricao: Ingestão de chunks de áudio em tempo real
        - nome: Streaming Tables / Materialized Views
          descricao: Resultados sempre frescos para dashboards
        - nome: Mosaic AI Model Serving
          descricao: Whisper + LLM em endpoints com autoscaling
        - nome: Real-Time Mode (RTM)
          descricao: Latência sub-segundo para casos extremos
      quando_usar: >-
        alerta a supervisor durante chamada problemática, próxima-melhor-ação
        ao agente, monitor de compliance ao vivo, dashboards operacionais.

    - titulo: Aplicação real-time com usuário
      icone: "🎙️"
      tag: INTERATIVO · esta demo
      cor: laranja
      descricao: >-
        App web com WebSocket onde um usuário grava áudio e recebe transcrição
        em ~2-4s, depois aciona análise sob demanda. Padrão para POCs,
        ferramentas internas e produtos voltados a usuário final.
      fluxo:
        - icone: "🌐"
          nome: Browser
          seta: "↔"
        - icone: "⚡"
          nome: Databricks App
          recursos:
            - tipo: app
              nome: aurelia-speech-analytics
        - icone: "🎙️"
          nome: Whisper Serving
          recursos:
            - tipo: endpoint
              nome: aurelia-whisper-turbo
        - icone: "🧠"
          nome: Claude FM API
          recursos:
            - tipo: endpoint
              nome: databricks-claude-sonnet-4-6
        - {icone: "📺", nome: UI}
      componentes:
        - nome: Databricks Apps
          descricao: Hosting do app web com OAuth automático
          recursos:
            - tipo: app
              nome: aurelia-speech-analytics
        - nome: Mosaic AI Model Serving (GPU)
          descricao: Whisper Turbo com scale-to-zero
          recursos:
            - tipo: endpoint
              nome: aurelia-whisper-turbo
        - nome: Foundation Model API
          descricao: Claude Sonnet 4.6 com JSON Schema
          recursos:
            - tipo: endpoint
              nome: databricks-claude-sonnet-4-6
        - nome: Unity Catalog
          descricao: Governança de modelo + endpoint
          recursos:
            - tipo: modelo
              nome: field_toolbox_catalog.aurelia_speech.whisper_large_v3_turbo
        - nome: Asset Bundles (DAB)
          descricao: Deploy do app + permissões de endpoints
        - nome: MLflow
          descricao: Versionamento e empacotamento do modelo
          recursos:
            - tipo: experimento
              id: "4268041011952223"
      quando_usar: >-
        ferramentas internas (coaching de agentes em treinamento), POCs e
        provas de conceito, demos para stakeholders, anotação manual de chamadas.
