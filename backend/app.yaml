# Databricks App config
# Docs: https://docs.databricks.com/dev-tools/databricks-apps/configuration.html

command:
  - "uvicorn"
  - "app:app"
  - "--host"
  - "0.0.0.0"
  - "--port"
  - "8000"

# Para levar o app a outro workspace, os campos a trocar são PORTAL_CATALOG,
# PORTAL_SCHEMA, PORTAL_JOB_ID e LAKEBASE_ENDPOINT.

env:
  # ----- Endpoints -----
  # Vazio desliga a gravação ao vivo (abas Configurar e Gravar). Para ligar, suba
  # o Whisper com notebooks/01_deploy_whisper_turbo.py e ponha o nome aqui.
  - name: WHISPER_ENDPOINT
    value: ""
  - name: WHISPER_SCHEMA
    value: "simple"
  - name: LLM_MODEL
    value: "databricks-claude-sonnet-4-6"
  - name: WHISPER_FLUSH_SECONDS
    value: "2.0"

  # ----- Portal: catalog/schema/volume + tabelas do pipeline -----
  - name: PORTAL_CATALOG
    value: "field_toolbox_catalog"
  - name: PORTAL_SCHEMA
    value: "aurelia_speech"
  - name: PORTAL_VOLUME
    value: "audio_landing"
  - name: PORTAL_TABLE_BRONZE
    value: "bronze_audio_files"
  - name: PORTAL_TABLE_SILVER
    value: "silver_transcripts"
  - name: PORTAL_TABLE_GOLD
    value: "gold_call_insights"

  # ----- SQL Warehouse usado pelas queries do dashboard -----
  - name: PORTAL_WAREHOUSE_ID
    valueFrom: "warehouse"

  # ----- Job que o botão Processar dispara (pipeline → pontuação → fila no Lakebase) -----
  - name: PORTAL_JOB_ID
    valueFrom: "job_diario"

  # ----- Lakebase: fila priorizada (leitura) e decisões do analista (escrita) -----
  # Sem PGUSER: o app entra como o próprio service principal (DATABRICKS_CLIENT_ID).
  - name: LAKEBASE_ENDPOINT
    value: "projects/aurelia-speech-ops/branches/production/endpoints/primary"
  - name: PGDATABASE
    value: "databricks_postgres"
