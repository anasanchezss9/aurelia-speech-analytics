# =====================================================================
# Pipeline declarativo (Lakeflow) — Speech Analytics de chamados de falta
# =====================================================================
# Uma jornada só, do arquivo à feature do modelo: áudio e texto viram
# transcrição, transcrição vira análise estruturada, e a análise se junta
# ao operacional (pedido, entrega, consultora, investigação) nas tabelas
# gold que o modelo, a fila do analista e o Genie leem.
#
# Serverless, triggered. Para transcrever com o Whisper em vez do
# ai_transcribe, troque o 02_silver_transcript_ai_transcribe.sql pelo
# 02_silver_transcript.sql — os dois publicam silver_transcripts.
# =====================================================================

resources:
  pipelines:
    aurelia_speech_lakeflow:
      name: aurelia-speech-lakeflow
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      continuous: false
      channel: PREVIEW
      libraries:
        - file: {path: ./01_bronze.sql}
        - file: {path: ./02_silver_transcript_ai_transcribe.sql}
        - file: {path: ./02c_silver_transcricoes.sql}
        - file: {path: ./03_gold_insights.sql}
        - file: {path: ./04_silver_operacional.sql}
        - file: {path: ./05_gold_operacional.sql}
      configuration:
        catalog:            ${var.catalog}
        schema:             ${var.schema}
        volume_landing:     audio_landing
        volume_operacional: operacional
        whisper_endpoint:   ${var.whisper_endpoint}
        llm_endpoint:       ${var.llm_endpoint}
        decisoes_lakebase:  ${var.catalog}.aurelia_speech_investigacao.lb_decisoes_history
