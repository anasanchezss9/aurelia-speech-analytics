bundle:
  name: aurelia-speech-analytics

include:
  - pipelines/declarative/pipeline.yml

variables:
  app_name:
    description: Nome do Databricks App
    default: aurelia-speech-analytics
  catalog:
    description: Catálogo do Unity Catalog onde o build vive
    default: field_toolbox_catalog
  schema:
    description: Schema do build (volumes, tabelas, modelos)
    default: aurelia_speech
  whisper_endpoint:
    description: Endpoint do Whisper para o pipeline com 02_silver_transcript.sql (opcional)
    default: aurelia-whisper-turbo
  llm_endpoint:
    description: Endpoint do LLM para análise
    default: databricks-claude-sonnet-4-6
  warehouse_id:
    description: SQL Warehouse usado pelo dashboard
    default: 9fc569e6e984dcde
  job_id:
    description: Job aurelia-speech-diario (pipeline, pontuação, fila no Lakebase)
    default: 186588700089291

resources:
  apps:
    speech_analytics:
      name: ${var.app_name}
      description: "Speech Analytics — auditoria de chamados de falta de produto (Aurélia Cosméticos)"
      source_code_path: ./backend
      resources:
        - name: llm
          description: Foundation Model API para a análise da aba Gravar
          serving_endpoint:
            name: ${var.llm_endpoint}
            permission: CAN_QUERY
        - name: warehouse
          description: SQL Warehouse usado pelo dashboard e pela transcrição na fila
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
        - name: job_diario
          description: Job que o botão Processar dispara
          job:
            id: ${var.job_id}
            permission: CAN_MANAGE_RUN
        - name: volume_audio
          description: Volume onde o upload grava os áudios
          uc_securable:
            securable_full_name: ${var.catalog}.${var.schema}.audio_landing
            securable_type: VOLUME
            permission: WRITE_VOLUME

targets:
  ft:
    mode: development
    default: true
    presets:
      name_prefix: ""
    workspace:
      host: https://fevm-field-toolbox.cloud.databricks.com
      profile: field-toolbox
